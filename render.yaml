services:
  - type: web
    name: hassan-electric-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hassan-electric-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: hassan-electric-db
    databaseName: hassan_electric
    user: hassan_electric
