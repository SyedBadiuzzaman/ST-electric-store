<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <style>
      .navy { fill: #1B2A4A; }
      .blue { fill: #2E86DE; }
      .gold { fill: #F5B041; }
      .orange { fill: #E67E22; }
      .white { fill: #FFFFFF; }
      .stroke-navy { stroke: #1B2A4A; fill: none; stroke-width: 3; stroke-linecap: round; }
      .stroke-blue { stroke: #2E86DE; fill: none; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="#FFFFFF" rx="10"/>

  <!-- Cable Coil (concentric arcs at top) -->
  <path d="M 130 180 A 120 120 0 0 1 370 180" class="stroke-navy" stroke-width="8"/>
  <path d="M 140 180 A 110 110 0 0 1 360 180" class="stroke-blue" stroke-width="6"/>
  <path d="M 150 180 A 100 100 0 0 1 350 180" class="stroke-navy" stroke-width="4"/>
  <path d="M 158 180 A 92 92 0 0 1 342 180" class="stroke-blue" stroke-width="3"/>

  <!-- Upward Arrow (growth) -->
  <polygon points="360,120 390,150 375,150 375,175 365,175 365,150 350,150" class="navy"/>

  <!-- Letter H -->
  <rect x="155" y="140" width="22" height="90" class="navy" rx="2"/>
  <rect x="210" y="140" width="22" height="90" class="navy" rx="2"/>
  <rect x="155" y="175" width="77" height="18" class="navy" rx="2"/>
  <!-- H gold accent -->
  <rect x="155" y="140" width="8" height="90" class="gold" rx="1"/>
  <rect x="155" y="175" width="77" height="5" class="gold" rx="1"/>

  <!-- Letter E -->
  <rect x="245" y="140" width="22" height="90" class="navy" rx="2"/>
  <rect x="245" y="140" width="65" height="18" class="navy" rx="2"/>
  <rect x="245" y="175" width="50" height="16" class="navy" rx="2"/>
  <rect x="245" y="212" width="65" height="18" class="navy" rx="2"/>
  <!-- E gold accent -->
  <rect x="245" y="140" width="8" height="90" class="gold" rx="1"/>
  <rect x="245" y="140" width="65" height="5" class="gold" rx="1"/>
  <rect x="245" y="212" width="65" height="5" class="gold" rx="1"/>

  <!-- Lightning Bolt -->
  <polygon points="330,150 310,195 325,195 315,230 345,185 328,185 340,150" class="orange"/>

  <!-- Circuit Board Traces (bottom) -->
  <line x1="130" y1="260" x2="220" y2="260" class="stroke-navy" stroke-width="3"/>
  <line x1="220" y1="260" x2="220" y2="290" class="stroke-navy" stroke-width="3"/>
  <line x1="220" y1="290" x2="310" y2="290" class="stroke-navy" stroke-width="3"/>
  <line x1="310" y1="290" x2="310" y2="260" class="stroke-navy" stroke-width="3"/>
  <line x1="310" y1="260" x2="390" y2="260" class="stroke-navy" stroke-width="3"/>

  <!-- Circuit Nodes (dots) -->
  <circle cx="130" cy="260" r="6" class="navy"/>
  <circle cx="220" cy="290" r="6" class="navy"/>
  <circle cx="310" cy="290" r="6" class="navy"/>
  <circle cx="390" cy="260" r="6" class="navy"/>
  <circle cx="220" cy="260" r="4" class="blue"/>
  <circle cx="310" cy="260" r="4" class="blue"/>

  <!-- Small Button/Switch Icon -->
  <rect x="175" y="200" width="14" height="20" class="blue" rx="3"/>
  <rect x="178" y="204" width="8" height="6" class="white" rx="1"/>

  <!-- Company Name -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" class="navy" letter-spacing="3">HASSAN ELECTRONIC</text>

  <!-- Tagline -->
  <text x="250" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E86DE" letter-spacing="2">CABLES • BUTTONS • ELECTRONICS</text>
</svg>